[project]
name = "ai-gateway"
version = "0.1.0"
description = "FastAPI AI gateway demoing GitGuardian secret scanning on LLM prompts/completions"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "mistralai>=2.8.0",
    "openai>=2.50.0",
    "uvicorn[standard]>=0.52.0",
]


[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
