[project]
name = "github-issues-prs-secret-scanning"
version = "0.1.0"
description = "GitGuardian secret scanning of GitHub issues and pull requests through a custom source"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
webhook = "app.main:main"
backfill = "app.backfill:main"

[build-system]
requires = ["uv_build>=0.9,<0.20"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""


[dependency-groups]
dev = [
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
